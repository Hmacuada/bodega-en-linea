<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual de Operaciones de Bodega – Cerro del Cobre</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="usuarios.js"></script>
  <script src="auth.js"></script>
  <script>if (!Auth.get()) location.replace("portada.html");</script>
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <a href="#/" class="brand"><img class="logo" src="img/logo.png" alt="Cerro del Cobre – Operaciones mineras"><span><b>Manual de Operaciones de Bodega</b><small>Trabajamos seguros, operamos mejor.</small></span></a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="upd"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Última actualización<br><small>10 de octubre de 2026</small></span></div>
      <div class="slogan">El orden<br>también es<br>seguridad</div>
      <svg class="house" width="84" height="60" viewBox="0 0 84 60" fill="none" stroke="#7fb0ff" stroke-width="2.4" stroke-linejoin="round"><path d="M4 28 40 6l40 22M12 24v32h60V24"/><rect x="22" y="34" width="16" height="22"/><rect x="46" y="38" width="14" height="18"/><path d="M66 38h6v18h-6z"/></svg>
    </div>
  </aside>
  <div class="wrap">
    <header class="top">
      <button class="icon-btn menu" id="menuBtn" aria-label="Abrir menú">☰</button>
      <div class="search" id="searchBox">
        <svg class="mag" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1d3f8f" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Buscar procedimientos, normas, palabra clave..." autocomplete="off" aria-label="Buscar">
        <div class="drop" id="drop" hidden></div>
      </div>
      <div class="tools">
        <div class="pw"><button class="ti" id="bellBtn" aria-label="Notificaciones" aria-haspopup="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d3f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><i id="bellCount" hidden>0</i></button><div class="pop" id="bellPop" hidden></div></div>
        <div class="pw"><button class="ti" id="helpBtn" aria-label="Ayuda" aria-haspopup="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d3f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg></button><div class="pop" id="helpPop" hidden></div></div>
        <div class="pw"><button class="user" id="userBtn" aria-haspopup="true"><img id="uAv" alt=""><span><b id="uName">Usuario</b><small id="uRole"></small></span><em>⌄</em></button><div class="pop right" id="userPop" hidden></div></div>
      </div>
    </header>
    <div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="mx" id="mx" aria-label="Cerrar">✕</button><div id="mbody"></div></div></div>

    <main id="app" class="main"></main>
    <footer class="foot"><span>Manual de Operaciones de Bodega</span><span>Versión 2.0</span><span>Cerro del Cobre</span><span class="note">Los complementos normativos deben verificarse en leychile.cl</span></footer>
  </div>
  <script src="../data.js"></script>
  <script src="../data2.js"></script>
  <script src="../detalle1.js"></script>
  <script src="../detalle2.js"></script>
  <script src="../detalle3.js"></script>
  <script src="../detalle4.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
  <script src="topbar.js"></script>
</body>
</html>
